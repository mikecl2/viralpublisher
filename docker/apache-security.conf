# viralpublisher-security.conf
#
# This app's directory layout puts data/, lib/, and scripts/ inside the
# same tree Apache serves as DocumentRoot (/var/www/html). Without these
# explicit deny rules, the SQLite database file — which holds every lead's
# email, all generated content, and admin config — would be directly
# downloadable by anyone who guessed or found the URL.
#
# Enabled via: a2enconf viralpublisher-security (done in the Dockerfile)

<Directory "/var/www/html">
    # No directory listings anywhere in the app
    Options -Indexes
</Directory>

# The SQLite database and any WAL/SHM files it produces. This is the
# single most important rule in this file.
<Directory "/var/www/html/data">
    Require all denied
</Directory>

# Shared PHP libraries — never meant to be hit directly over HTTP, only
# require_once'd by the actual endpoint scripts.
<Directory "/var/www/html/lib">
    Require all denied
</Directory>

# One-off seed/maintenance scripts — meant to be run via `php scripts/x.php`
# inside the container, never over HTTP.
<Directory "/var/www/html/scripts">
    Require all denied
</Directory>

# Admin's internal helper libraries (auth, layout, model-cache logic) —
# same reasoning as /lib above. The admin/*.php pages themselves stay
# reachable; only this subfolder is blocked.
<Directory "/var/www/html/admin/lib">
    Require all denied
</Directory>

# Defense in depth: block any dotfiles (.env, .git, etc.) anywhere in the tree.
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
