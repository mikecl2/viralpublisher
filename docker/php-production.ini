; docker/php-production.ini
; Applied on top of PHP's defaults inside the container.

; Never leak stack traces or file paths to visitors — log them instead.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; The OpenRouter proxy uses a 30s curl timeout; give PHP enough headroom
; beyond that so a slow model response doesn't get cut off by PHP itself
; before curl even gets a chance to time out on its own.
max_execution_time = 60

; SQLite + generated JSON payloads are small; defaults are already generous,
; this just makes the ceiling explicit rather than relying on the image default.
memory_limit = 128M

; No file uploads anywhere in this app.
file_uploads = Off

; Sessions are only used by the admin panel — keep default file-based storage,
; nothing special needed since this runs as a single container.
