; docker/php-production.ini
; Applied on top of PHP's defaults inside the container.

; Never leak stack traces or file paths to visitors — log them instead.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Script Builder's AI proxy call uses a 75s curl timeout (see api/ai-proxy.php)
; since its 7-section output is ~3x heavier than the other tools' and was
; hitting the old shared 30s timeout in production. This must stay comfortably
; above that 75s, or PHP kills the whole request first — silently, with no
; JSON error response and no error_log line, which is strictly worse than
; letting curl's own timeout fire with a clear, logged reason.
max_execution_time = 90

; SQLite + generated JSON payloads are small; defaults are already generous,
; this just makes the ceiling explicit rather than relying on the image default.
memory_limit = 128M

; No file uploads anywhere in this app.
file_uploads = Off

; Sessions are only used by the admin panel — keep default file-based storage,
; nothing special needed since this runs as a single container.
